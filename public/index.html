<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Рассрочка в МойСклад</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section id="branchScreen" class="branch-screen">
      <div class="branch-panel">
        <p class="eyebrow">Выбор филиала</p>
        <h1>Где оформить документ?</h1>
        <div class="branch-actions">
          <button class="branch-button" type="button" data-branch="ayu">Аю-Гранд</button>
          <button class="branch-button" type="button" data-branch="besh">Беш-Сары</button>
        </div>
      </div>
    </section>

    <main class="app">
      <section class="panel">
        <div class="heading">
          <p class="eyebrow">Расчет рассрочки</p>
          <h1>Создание документа в МойСклад</h1>
          <p id="branchLabel" class="branch-label"></p>
        </div>

        <form id="orderForm" class="form">
          <button id="addItemButton" class="secondary-button" type="button">Добавить товар в документ</button>

          <div id="itemsList" class="items-list wide"></div>

          <label class="wide">
            <span>Поиск товара</span>
            <input id="productSearch" name="productSearch" placeholder="Название или код товара">
          </label>

          <label>
            <span>Наличными сразу</span>
            <input id="cashPrepayment" name="cashPrepayment" inputmode="decimal" value="0">
          </label>

          <label>
            <span>Переводом сразу</span>
            <input id="transferPrepayment" name="transferPrepayment" inputmode="decimal" value="0">
          </label>

          <label class="wide">
            <span>Тип оплаты</span>
            <select id="paymentType" name="paymentType"></select>
          </label>

          <label class="wide">
            <span>Сотрудник</span>
            <select id="employee" name="employee"></select>
          </label>

          <label class="wide">
            <span>Точка продаж</span>
            <select id="store" name="store"></select>
          </label>

          <fieldset class="wide client-mode">
            <legend>Клиент</legend>
            <label>
              <input type="radio" name="customerMode" value="new" checked>
              <span>Новый клиент</span>
            </label>
            <label>
              <input type="radio" name="customerMode" value="existing">
              <span>Старый клиент</span>
            </label>
          </fieldset>

          <label id="customerSearchField" class="wide hidden">
            <span>Поиск старого клиента</span>
            <input id="customerSearch" name="customerSearch" placeholder="Имя или телефон клиента">
          </label>

          <label id="existingCustomerField" class="wide hidden">
            <span>Старый клиент</span>
            <select id="existingCustomer" name="existingCustomer"></select>
          </label>

          <button id="addMissingCustomerButton" class="secondary-button hidden" type="button">Добавить как нового клиента</button>

          <label>
            <span>Имя клиента</span>
            <input id="customerName" name="customerName" placeholder="Например: Айбек" required>
          </label>

          <label>
            <span>Телефон</span>
            <input id="customerPhone" name="customerPhone" placeholder="+996 ..." required>
          </label>

          <label class="wide">
            <span>Адрес клиента</span>
            <input id="customerAddress" name="customerAddress" placeholder="Город, улица, дом">
          </label>

          <p id="customerDuplicateWarning" class="inline-warning wide hidden"></p>

          <button id="submitButton" type="submit">Создать документ</button>
        </form>
      </section>

      <section class="summary" aria-live="polite">
        <div>
          <span>Сумма товара</span>
          <strong id="baseTotal">100 000,00 сом</strong>
        </div>
        <div>
          <span>Позиция</span>
          <strong id="productLabel">Загрузка...</strong>
        </div>
        <div>
          <span>Тип оплаты</span>
          <strong id="paymentTypeLabel">M+ (6 мес)</strong>
        </div>
        <div>
          <span>Оплачено сразу</span>
          <strong id="prepaidTotal">0,00 сом</strong>
        </div>
        <div>
          <span>В рассрочку</span>
          <strong id="installmentBase">100 000,00 сом</strong>
        </div>
        <hr>
        <strong id="commission" hidden>10 000,00 сом</strong>
        <div>
          <span>Итог</span>
          <strong id="finalTotal">110 000,00 сом</strong>
        </div>
        <div>
          <span>Платеж в месяц</span>
          <strong id="monthlyPayment">18 333,33 сом</strong>
        </div>
        <p id="status" class="status"></p>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
