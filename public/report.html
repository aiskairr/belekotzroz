<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отчетность продаж</title>
    <link rel="stylesheet" href="/report.css?v=20260626-dark-fix-2">
    <link rel="stylesheet" href="/crm-shell.css?v=20260626-dark-fix">
  </head>
  <body>
    <main class="report-app">
      <section id="reportPanel" class="report-panel hidden">
        <header class="report-header">
          <div>
            <p class="eyebrow">Продажи и отгрузки</p>
            <h1>Отчетность</h1>
          </div>
        </header>

        <nav class="report-type-tabs" aria-label="Тип документов">
          <button class="active" type="button" data-report-type="retaildemand">
            <span>Продажи</span><strong id="salesTabCount">0</strong>
          </button>
          <button type="button" data-report-type="demand">
            <span>Отгрузки</span><strong id="demandsTabCount">0</strong>
          </button>
        </nav>

        <form id="filtersForm" class="filters">
          <div class="period-picker">
            <div class="period-tabs" aria-label="Быстрый выбор периода">
              <span>Период:</span>
              <button type="button" data-period="yesterday">вч</button>
              <button type="button" data-period="today">сег</button>
              <button type="button" data-period="week">нед</button>
              <button type="button" data-period="month">мес</button>
            </div>
            <div class="period-display">
              <button id="periodPrev" class="period-arrow" type="button" aria-label="Предыдущий период">‹</button>
              <strong id="periodLabel">Сегодня</strong>
              <button id="periodNext" class="period-arrow" type="button" aria-label="Следующий период">›</button>
            </div>
          </div>
          <label>
            <span>С даты</span>
            <input id="dateFrom" name="dateFrom" type="date" required>
          </label>
          <label>
            <span>По дату</span>
            <input id="dateTo" name="dateTo" type="date" required>
          </label>
          <label>
            <span>Точка продаж</span>
            <select id="retailStore" name="retailStore"></select>
          </label>
          <button type="submit">Показать</button>
          <button id="printButton" class="secondary" type="button">Печать</button>
        </form>

        <section class="total-grid">
          <div>
            <span>Документов</span>
            <strong id="totalDocuments">0</strong>
          </div>
          <div>
            <span>Сумма</span>
            <strong id="totalAmount">0,00 сом</strong>
          </div>
          <div>
            <span>Оплачено</span>
            <strong id="totalPaid">0,00 сом</strong>
          </div>
          <div>
            <span>Не оплачено</span>
            <strong id="totalUnpaid">0,00 сом</strong>
          </div>
          <div id="profitSummaryCard">
            <span>Чистая прибыль</span>
            <strong id="totalNetProfit">0,00 сом</strong>
          </div>
        </section>

        <section class="table-card">
          <div class="table-title">
            <h2 id="documentsTitle">Продажи</h2>
            <p id="reportStatus" class="status"></p>
          </div>
          <div id="reportRows" class="document-list">
            <div class="empty-state">Выберите период и нажмите "Показать".</div>
          </div>
        </section>
      </section>
    </main>

    <section id="printReport" class="print-report" aria-hidden="true"></section>

    <script src="/report.js?v=20260623-gifts" type="module"></script>
  </body>
</html>
